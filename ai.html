---
layout: default
---
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 助手 · 小小崔</title>
  <meta name="description" content="和小小崔网站上的 AI 助手聊天，它还能帮你生成可运行的单文件 HTML。" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=Noto+Serif+SC:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ '/css/style.css' | relative_url }}" />
  <style>
    /* ---------- 聊天页专用布局 ---------- */
    .chat-shell { max-width: 760px; margin: 0 auto; padding: 0 16px; height: calc(100vh - 0px); display: flex; flex-direction: column; }
    .chat-head { padding: 16px 2px 10px; display: flex; align-items: center; gap: 12px; }
    .chat-head .logo { font-size: 26px; }
    .chat-head h1 { font-size: 19px; margin: 0; font-family: "Noto Serif SC", serif; }
    .chat-head .sub { font-size: 12.5px; color: var(--muted, #9a9088); }
    .chat-head .clear-btn {
      margin-left: auto; border: 1px solid var(--line, #e7e0d6); background: var(--surface, #fff);
      color: var(--ink-soft, #6b6258); font-size: 13px; padding: 7px 14px; border-radius: 999px; cursor: pointer; font-family: inherit;
    }
    .chat-head .clear-btn:active { transform: scale(.96); }

    #chat { flex: 1; overflow-y: auto; padding: 8px 2px 16px; -webkit-overflow-scrolling: touch; }
    .msg { display: flex; gap: 10px; margin-bottom: 16px; animation: msgIn .2s ease; }
    @keyframes msgIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    .msg .avatar {
      width: 34px; height: 34px; flex: 0 0 34px; border-radius: 50%;
      display: grid; place-items: center; font-size: 17px;
      background: var(--surface, #fff); border: 1px solid var(--line, #e7e0d6);
    }
    .msg.user { flex-direction: row-reverse; }
    .msg.user .avatar { background: var(--accent, #7d9b86); border-color: var(--accent, #7d9b86); color: #fff; }
    .bubble {
      max-width: calc(100% - 52px); padding: 11px 15px; border-radius: 16px; font-size: 15px; line-height: 1.75;
      background: var(--surface, #fff); border: 1px solid var(--line, #e7e0d6);
      box-shadow: 0 4px 16px rgba(60,50,40,.06); word-wrap: break-word; overflow-wrap: anywhere;
    }
    .msg.user .bubble { background: var(--accent, #7d9b86); color: #fff; border-color: var(--accent, #7d9b86); }
    .bubble p { margin: 0 0 8px; } .bubble p:last-child { margin-bottom: 0; }
    .bubble ul, .bubble ol { margin: 4px 0 8px; padding-left: 22px; }
    .bubble li { margin: 2px 0; }
    .bubble :not(pre) > code {
      background: rgba(125,155,134,.14); padding: 1px 6px; border-radius: 6px;
      font-size: 13px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    .msg.user .bubble :not(pre) > code { background: rgba(255,255,255,.25); }
    .bubble pre {
      position: relative; margin: 8px 0; padding: 14px 12px 12px; border-radius: 12px; overflow-x: auto;
      background: #2f2c28; color: #f1ede6; font-size: 13px; line-height: 1.6;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    .bubble pre code { background: none; padding: 0; color: inherit; white-space: pre; }
    .code-bar { position: absolute; top: 6px; right: 6px; display: flex; gap: 6px; }
    .code-bar button {
      border: none; cursor: pointer; font-size: 11.5px; font-family: inherit;
      padding: 3px 10px; border-radius: 999px; background: rgba(255,255,255,.16); color: #f1ede6;
    }
    .code-bar button:active { background: rgba(255,255,255,.3); }
    .reasoning { font-size: 13px; color: var(--muted, #9a9088); border-left: 3px solid var(--line, #e7e0d6); padding-left: 10px; margin-bottom: 8px; }
    .reasoning summary { cursor: pointer; }
    .typing { display: inline-flex; gap: 4px; padding: 4px 2px; }
    .typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted, #9a9088); animation: blink 1.2s infinite; }
    .typing i:nth-child(2) { animation-delay: .2s; } .typing i:nth-child(3) { animation-delay: .4s; }
    @keyframes blink { 0%, 60%, 100% { opacity: .25; } 30% { opacity: 1; } }
    .err { color: #c0453b; font-size: 13.5px; }

    .suggest { display: flex; gap: 8px; flex-wrap: wrap; padding: 4px 2px 10px; }
    .suggest button {
      border: 1px solid var(--line, #e7e0d6); background: var(--surface, #fff); color: var(--ink-soft, #6b6258);
      font-size: 13px; padding: 7px 14px; border-radius: 999px; cursor: pointer; font-family: inherit;
    }
    .suggest button:active { transform: scale(.96); }

    .composer {
      position: sticky; bottom: 0; padding: 10px 0 calc(10px + env(safe-area-inset-bottom));
      background: linear-gradient(to top, var(--bg, #faf7f2) 70%, rgba(250,247,242,0));
    }
    .composer-inner { display: flex; gap: 8px; align-items: flex-end; background: var(--surface, #fff);
      border: 1px solid var(--line, #e7e0d6); border-radius: 20px; padding: 8px 8px 8px 16px; box-shadow: 0 4px 16px rgba(60,50,40,.08); }
    #input {
      flex: 1; border: none; outline: none; resize: none; max-height: 120px; min-height: 24px;
      font-family: inherit; font-size: 15.5px; line-height: 1.55; background: transparent; color: var(--ink, #2f2c28);
      padding: 4px 0;
    }
    #send, #stop {
      border: none; cursor: pointer; flex: 0 0 auto; width: 42px; height: 42px; border-radius: 50%;
      display: grid; place-items: center; font-size: 17px; font-family: inherit;
    }
    #send { background: var(--accent, #7d9b86); color: #fff; }
    #send:disabled { opacity: .4; cursor: default; }
    #stop { background: var(--accent-2, #c08552); color: #fff; display: none; }
    .composer.sending #send { display: none; }
    .composer.sending #stop { display: grid; }
    .chat-foot { text-align: center; font-size: 11.5px; color: var(--muted, #9a9088); padding-bottom: 8px; }

    /* 电脑端稍微宽松 */
    @media (min-width: 720px) {
      .chat-shell { padding-bottom: 0; }
      .bubble { font-size: 15.5px; }
    }
  </style>
</head>
<body>
  <header id="site-nav"></header>

  <main class="chat-shell">
    <div class="chat-head">
      <span class="logo">🤖</span>
      <div>
        <h1>MiMo AI 助手</h1>
        <div class="sub">小米 MiMo-V2.5 · 由本网站的安全代理提供服务</div>
      </div>
      <button class="clear-btn" id="clear">清空对话</button>
    </div>

    <div id="chat"></div>

    <div class="suggest" id="suggest">
      <button data-q="你好，介绍一下你自己吧！">👋 打个招呼</button>
      <button data-q="帮我生成一个好看的个人名片单页 HTML，要适配手机">🎨 生成名片页</button>
      <button data-q="用单个 HTML 文件写一个猜数字小游戏">🎮 写个小游戏</button>
      <button data-q="帮我写一个番茄钟网页，带倒计时圆环">⏱️ 做个小工具</button>
    </div>

    <div class="composer" id="composer">
      <div class="composer-inner">
        <textarea id="input" rows="1" placeholder="说点什么… 让它生成 HTML 也可以"></textarea>
        <button id="stop" aria-label="停止">■</button>
        <button id="send" aria-label="发送">➤</button>
      </div>
    </div>
    <div class="chat-foot">AI 生成内容仅供参考 · 密钥保存在服务端，不会暴露在网页里</div>
  </main>

  <footer id="site-footer"></footer>

  <script src="{{ '/js/data.js' | relative_url }}"></script>
  <script src="{{ '/js/main.js' | relative_url }}"></script>
  <script>
  (function () {
    "use strict";

    /* ====== 改成你部署好的 Worker 地址（结尾不要带斜杠） ====== */
    var API_URL = "https://mimo-chat.WORKER_SUBDOMAIN.workers.dev/api/chat";

    var STORE_KEY = "xxcaichat_v1";
    var chatEl = document.getElementById("chat");
    var inputEl = document.getElementById("input");
    var sendBtn = document.getElementById("send");
    var stopBtn = document.getElementById("stop");
    var composer = document.getElementById("composer");
    var suggestEl = document.getElementById("suggest");

    var history = [];
    try { history = JSON.parse(localStorage.getItem(STORE_KEY) || "[]"); } catch (e) { history = []; }

    var abortCtrl = null;
    var streaming = false;

    function save() {
      try { localStorage.setItem(STORE_KEY, JSON.stringify(history.slice(-40))); } catch (e) {}
    }
    function esc(s) {
      return String(s).replace(/[&<>"']/g, function (c) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
      });
    }
    /* 极简 Markdown：代码块、行内代码、粗体、列表、段落 */
    function md(text) {
      var parts = text.split(/```/);
      var html = "";
      for (var i = 0; i < parts.length; i++) {
        if (i % 2 === 1) {
          var raw = parts[i];
          var nl = raw.indexOf("\n");
          var lang = nl >= 0 ? raw.slice(0, nl).trim() : "";
          var code = nl >= 0 ? raw.slice(nl + 1) : raw;
          code = code.replace(/\n$/, "");
          var bar =
            '<div class="code-bar">' +
              (lang.toLowerCase() === "html"
                ? '<button data-act="run" data-lang="html">▶ 运行</button>'
                : "") +
              '<button data-act="copy">复制</button>' +
            "</div>";
          html += "<pre>" + bar + "<code>" + esc(code) + "</code></pre>";
        } else {
          html += inline(parts[i]);
        }
      }
      return html;
    }
    function inline(t) {
      var lines = t.replace(/\r\n/g, "\n").split(/\n{2,}/);
      return lines.map(function (block) {
        block = block.trim();
        if (!block) return "";
        var b = esc(block)
          .replace(/`([^`]+)`/g, "<code>$1</code>")
          .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
        if (/^\n*[-*] /m.test(block)) {
          var items = block.split(/\n/).filter(Boolean).map(function (l) {
            return "<li>" + l.replace(/^[-*]\s+/, "").replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>") + "</li>";
          }).join("");
          return "<ul>" + items + "</ul>";
        }
        return "<p>" + b.replace(/\n/g, "<br>") + "</p>";
      }).join("");
    }

    function row(role) {
      var div = document.createElement("div");
      div.className = "msg " + role;
      div.innerHTML =
        '<div class="avatar">' + (role === "user" ? "我" : "🤖") + "</div>" +
        '<div class="bubble"></div>';
      chatEl.appendChild(div);
      return div.querySelector(".bubble");
    }
    function scrollBottom() { chatEl.scrollTop = chatEl.scrollHeight; }

    function renderHistory() {
      chatEl.innerHTML = "";
      if (!history.length) {
        var b = row("assistant");
        b.innerHTML = "<p>你好呀，我是 MiMo 助手 👋</p><p>可以陪你聊天、回答问题，也能帮你<b>直接生成可以运行的单文件 HTML</b>（网页、小游戏、小工具都行）。下面有几个快捷玩法，或者直接输入你想做的东西～</p>";
        return;
      }
      history.forEach(function (m) {
        var b = row(m.role);
        b.innerHTML = m.role === "assistant" ? md(m.content) : "<p>" + esc(m.content).replace(/\n/g, "<br>") + "</p>";
      });
      scrollBottom();
    }

    function autosize() {
      inputEl.style.height = "auto";
      inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + "px";
    }
    inputEl.addEventListener("input", autosize);
    inputEl.addEventListener("keydown", function (e) {
      if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
        e.preventDefault();
        send();
      }
    });
    sendBtn.addEventListener("click", send);
    stopBtn.addEventListener("click", function () { if (abortCtrl) abortCtrl.abort(); });
    document.getElementById("clear").addEventListener("click", function () {
      if (streaming) return;
      if (!history.length || confirm("确定清空全部对话记录吗？（只清你本机的记录）")) {
        history = []; save(); renderHistory();
      }
    });
    suggestEl.addEventListener("click", function (e) {
      var btn = e.target.closest("button[data-q]");
      if (btn && !streaming) { inputEl.value = btn.getAttribute("data-q"); autosize(); send(); }
    });

    /* 代码块按钮（事件委托） */
    chatEl.addEventListener("click", function (e) {
      var btn = e.target.closest("button[data-act]");
      if (!btn) return;
      var pre = btn.closest("pre");
      var code = pre ? pre.querySelector("code").textContent : "";
      if (btn.getAttribute("data-act") === "copy") {
        navigator.clipboard.writeText(code).then(function () {
          btn.textContent = "已复制 ✓"; setTimeout(function () { btn.textContent = "复制"; }, 1500);
        }).catch(function () {});
      } else if (btn.getAttribute("data-act") === "run") {
        var blob = new Blob([code], { type: "text/html;charset=utf-8" });
        var url = URL.createObjectURL(blob);
        window.open(url, "_blank");
      }
    });

    async function send() {
      var q = inputEl.value.trim();
      if (!q || streaming) return;
      inputEl.value = ""; autosize();

      history.push({ role: "user", content: q });
      var userBubble = row("user");
      userBubble.innerHTML = "<p>" + esc(q).replace(/\n/g, "<br>") + "</p>";
      suggestEl.style.display = "none";
      scrollBottom();

      var bubble = row("assistant");
      bubble.innerHTML = '<span class="typing"><i></i><i></i><i></i></span>';

      streaming = true;
      composer.classList.add("sending");
      abortCtrl = new AbortController();

      var answer = "";
      var reasoning = "";
      var paintTimer = null;

      try {
        var resp = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ messages: history, stream: true }),
          signal: abortCtrl.signal
        });
        if (!resp.ok || !resp.body) {
          var errInfo = "";
          try { errInfo = (await resp.json()).message || ""; } catch (e) {}
          throw new Error("服务返回 " + resp.status + (errInfo ? "：" + errInfo : ""));
        }

        var reader = resp.body.getReader();
        var decoder = new TextDecoder("utf-8");
        var buffer = "";
        var firstChunk = true;

        function paint() {
          var html = "";
          if (reasoning) html += '<details class="reasoning" open><summary>思考过程</summary>' + esc(reasoning) + "</details>";
          html += md(answer) || '<span class="typing"><i></i><i></i><i></i></span>';
          bubble.innerHTML = html;
          scrollBottom();
        }

        while (true) {
          var chunk = await reader.read();
          if (chunk.done) break;
          buffer += decoder.decode(chunk.value, { stream: true });
          var lines = buffer.split("\n");
          buffer = lines.pop();
          for (var li = 0; li < lines.length; li++) {
            var line = lines[li].trim();
            if (!line || line.indexOf("data:") !== 0) continue;
            var data = line.slice(5).trim();
            if (data === "[DONE]") continue;
            try {
              var json = JSON.parse(data);
              var delta = json.choices && json.choices[0] && json.choices[0].delta;
              if (delta) {
                if (delta.content) answer += delta.content;
                if (delta.reasoning_content) reasoning += delta.reasoning_content;
              }
            } catch (e) { /* 忽略不完整分片 */ }
          }
          if (firstChunk) { firstChunk = false; }
          if (!paintTimer) {
            paintTimer = setTimeout(function () { paintTimer = null; paint(); }, 60);
          }
        }
        clearTimeout(paintTimer);
        if (!answer) answer = "（这次没有返回内容，再试一次吧）";
        paint();

        history.push({ role: "assistant", content: answer });
        save();
      } catch (err) {
        if (err.name === "AbortError") {
          if (answer) {
            history.push({ role: "assistant", content: answer });
            bubble.innerHTML = md(answer) + '<p class="err">（已停止生成）</p>';
            save();
          } else {
            bubble.innerHTML = '<p class="err">已停止。</p>';
          }
        } else {
          bubble.innerHTML = '<p class="err">出错了：' + esc(err.message) + "</p>" +
            '<p class="err">可以检查网络后重试；如果反复失败，可能是服务端密钥或额度问题。</p>';
        }
        scrollBottom();
      } finally {
        streaming = false;
        composer.classList.remove("sending");
        abortCtrl = null;
        inputEl.focus();
      }
    }

    renderHistory();
  })();
  </script>
</body>
</html>
