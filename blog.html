<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>博客 · 小小崔</title>
  <meta name="description" content="小小崔的个人博客：开发随笔、学习记录与想法。" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=Noto+Serif+SC:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <header id="site-nav"></header>

  <main>
    <section class="section wrap">
      <div class="section-head">
        <div>
          <h2>博客</h2>
          <div class="sub">随手记下的想法与过程</div>
        </div>
      </div>
      <div id="posts-list"></div>
      <div class="note">
        写新文章：复制 <code>blog/template.html</code> 改名（如 <code>blog/post-xxx.html</code>），填好标题和正文；
        再到 <code>js/data.js</code> 的 <code>POSTS</code> 数组里加一条（标题、日期、摘要、链接）。列表会自动按日期排序。
      </div>
    </section>
  </main>

  <footer id="site-footer"></footer>

  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
